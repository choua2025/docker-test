server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # UTF-8 everywhere, so Lao text is never mangled.
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  # Docker's embedded DNS server. Naming it, and putting the upstream in a
  # variable, makes nginx look the backend up per request instead of once at
  # startup - so this container can start before the backend exists, and
  # survives the backend being restarted or rebuilt.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API and the site share one origin, which means no CORS and no
  # hard-coded API hostname baked into the JavaScript bundle.
  location /api/ {
    set $api_upstream http://backend:9000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed asset filenames never change content, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths must return index.html so that
  # refreshing on /login does not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
